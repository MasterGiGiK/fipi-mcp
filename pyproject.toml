[project]
name = "fipi-mcp"
version = "0.1.0"
description = "MCP server for FIPI (Russian state exam) open task bank"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vasin.nikserter@gmail.com" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.scripts]
fipi-mcp = "fipi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fipi_mcp"]
