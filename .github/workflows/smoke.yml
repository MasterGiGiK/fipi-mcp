name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # ежедневный прогон — ловит поломки после изменений на fipi.ru
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import check
        run: python -c "import fipi_mcp; print('tools:', list(fipi_mcp.mcp._tool_manager._tools))"

      - name: Live smoke against ege.fipi.ru
        timeout-minutes: 3
        run: python -m examples.smoke_test
