name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  offline:
    name: offline (parser + mathml)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import check
        run: python -c "import fipi_mcp; print('tools:', list(fipi_mcp.mcp._tool_manager._tools))"
      - name: Offline tests
        run: python -m tests.test_offline

  live:
    name: live (ege.fipi.ru — may fail from GitHub runners)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Live smoke
        timeout-minutes: 3
        run: python -m examples.smoke_test
